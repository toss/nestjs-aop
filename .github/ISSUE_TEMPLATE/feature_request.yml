name: Feature request
description: Suggest an idea for this project
title: "[Feature]: "
labels: []
body:
  - type: markdown
    attributes:
      value: |
        Before opening an issue, please [search the existing ones](https://github.com/toss/nestjs-aop/issues) — if you find a similar request, upvote it instead of opening a new one.
  - type: textarea
    id: overview
    attributes:
      label: Overview
      description: A clear and concise description of the feature.
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: Describe the solution you'd like
      description: A clear and concise description of what you want to happen.
    validations:
      required: true
  - type: textarea
    id: additional-context
    attributes:
      label: Additional context
      description: Add any other context or screenshots about the feature request here.
    validations:
      required: false
  - type: checkboxes
    id: validations
    attributes:
      label: Validations
      options:
        - label: I searched the existing issues.
          required: true
        - label: I read the [Contributing Guide](https://github.com/toss/nestjs-aop/blob/v2.x/CONTRIBUTING.md).
          required: true
