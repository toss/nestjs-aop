name: CI

on:
  pull_request:
    branches:
      - main
      - 'v*'

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Setup toolchain (node/pnpm via mise)
        uses: jdx/mise-action@v4

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Build
        run: |
          pnpm build

      - name: Test
        run: |
          pnpm test
