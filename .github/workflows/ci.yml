name: CI

on:
  pull_request:
    branches:
      - main
      - 'v*'

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Setup toolchain (node/pnpm via mise)
        uses: jdx/mise-action@v4

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Build
        run: |
          pnpm build

      - name: Type tests
        run: pnpm test:types

      - name: Test
        run: |
          pnpm test

  # Every major version listed in `peerDependencies` gets built and tested here,
  # so the support range in package.json stays an actually verified claim.
  compat:
    name: NestJS v${{ matrix.nest }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        nest: [8, 9, 10, 11, 12]
    steps:
      - uses: actions/checkout@v7

      - name: Setup toolchain (node/pnpm via mise)
        uses: jdx/mise-action@v4

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Pin @nestjs/* to v${{ matrix.nest }}
        run: >-
          pnpm add -D
          "@nestjs/common@^${{ matrix.nest }}"
          "@nestjs/core@^${{ matrix.nest }}"
          "@nestjs/platform-fastify@^${{ matrix.nest }}"
          "@nestjs/testing@^${{ matrix.nest }}"

      - name: Build
        run: pnpm build

      - name: Type tests
        run: pnpm test:types

      - name: Test
        run: pnpm test
