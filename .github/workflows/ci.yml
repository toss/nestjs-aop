name: CI

on:
  pull_request:
    branches:
      - main
      - 'v*'

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Setup toolchain (node/pnpm via mise)
        uses: jdx/mise-action@v4

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Typecheck source and tests
        run: pnpm typecheck

      - name: Test packaging assertions
        run: pnpm test:packaging

      - name: Build
        run: |
          pnpm build

      - name: Test
        run: |
          pnpm test

  # Reproducible Node/Nest pairs exercise repository tests and packed consumers.
  # compat-range below separately covers Nest minimums and current major ranges.
  compat:
    name: NestJS ${{ matrix.nest }} / Node ${{ matrix.node }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        nest: [10.4.22, 11.2.6, 12.1.0]
        node: [22.12.0, 24.19.0, 26.10.0]
    steps:
      - uses: actions/checkout@v7

      - name: Setup toolchain (node/pnpm via mise)
        uses: jdx/mise-action@v4

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Pin @nestjs/* to v${{ matrix.nest }}
        run: >-
          pnpm add -D
          "@nestjs/common@${{ matrix.nest }}"
          "@nestjs/core@${{ matrix.nest }}"
          "@nestjs/platform-fastify@${{ matrix.nest }}"
          "@nestjs/testing@${{ matrix.nest }}"

      - name: Install runtime under test
        run: mise install node@${{ matrix.node }}

      - name: Typecheck source and tests
        run: mise exec node@${{ matrix.node }} -- pnpm typecheck

      - name: Test packaging assertions
        run: mise exec node@${{ matrix.node }} -- pnpm test:packaging

      - name: Build
        run: mise exec node@${{ matrix.node }} -- pnpm build

      - name: Test
        run: mise exec node@${{ matrix.node }} -- pnpm test

      - name: Pack and test independent consumers
        run: |
          mise exec node@${{ matrix.node }} -- pnpm pack --out /tmp/nestjs-aop.tgz
          mise exec node@${{ matrix.node }} -- npm run test:packed -- /tmp/nestjs-aop.tgz "${{ matrix.nest }}"

  compat-range:
    name: NestJS range ${{ matrix.nest }} / Node 24.19.0
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        nest: ['10.0.0', '11.0.0', '12.0.1', '^10', '^11', '^12']
    steps:
      - uses: actions/checkout@v7

      - name: Setup toolchain (node/pnpm via mise)
        uses: jdx/mise-action@v4

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Pack and test minimum/current Nest consumers
        run: |
          pnpm pack --out /tmp/nestjs-aop.tgz
          npm run test:packed -- /tmp/nestjs-aop.tgz "${{ matrix.nest }}"
